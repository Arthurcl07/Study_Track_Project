# CI do StudyTrack (OPEN-024, seguranca-ssdlc.md camada 4): tipos e suíte completa de testes
# em todo PR e push para development e main, com um PostgreSQL 17 descartável.
# Nenhum segredo real: o banco só existe durante a execução e o JWT_SECRET é gerado a cada rodada.
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studytrack
          POSTGRES_PASSWORD: studytrack_ci
          POSTGRES_DB: studytrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studytrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://studytrack:studytrack_ci@localhost:5432/studytrack_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Gerar JWT_SECRET só desta execução
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Instalar dependências (inclui prisma generate)
        run: npm ci

      - name: Aplicar migrações
        run: npx prisma migrate deploy

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Testes (Vitest)
        run: npm test

      # Garante que a aplicação compila em modo de produção (o mesmo `next build` de uma publicação).
      - name: Build de produção
        run: npm run build
