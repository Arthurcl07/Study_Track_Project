<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyTrack — Protótipo de layout</title>
<style>
  /* Tokens de docs/identidade-visual.md */
  :root {
    --marinho: #0F2A4A; --marinho-claro: #1E3A5F; --azul: #2563EB; --azul-escuro: #1D4ED8;
    --azul-suave: #DBEAFE; --ceu: #93C5FD; --nevoa: #F5F7FB; --branco: #FFFFFF; --traco: #E2E8F0;
    --texto: #0F172A; --mudo: #64748B;
    --normal: #15803D; --normal-bg: #DCFCE7; --atencao: #B45309; --atencao-bg: #FEF3C7; --risco: #B91C1C; --risco-bg: #FEE2E2;
    --ok-bg: #F0FDF4; --erro-bg: #FEF2F2; --info: #1D4ED8; --info-bg: #EFF6FF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, "Segoe UI", system-ui, sans-serif; color: var(--texto); background: #E9EDF3; }
  .controles { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--traco); font-size: 14px; }
  .controles select, .controles button { font: inherit; padding: 6px 10px; border: 1px solid var(--traco); border-radius: 8px; background: #fff; cursor: pointer; }
  .controles button[aria-pressed="true"] { background: var(--marinho); color: #fff; border-color: var(--marinho); }
  .controles .nota { color: var(--mudo); margin-left: auto; }
  .palco { display: flex; justify-content: center; padding: 24px 12px 48px; }
  .moldura { width: 1200px; max-width: 100%; height: 760px; background: var(--nevoa); border-radius: 14px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(15,23,42,.18); container-type: inline-size; position: relative; }
  .moldura.celular { width: 390px; height: 800px; border: 10px solid #111; border-radius: 34px; }
  .tela { height: 100%; overflow: auto; }

  /* Casca autenticada */
  .casca { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
  .lateral { background: var(--marinho); color: #fff; display: flex; flex-direction: column; padding: 20px 14px; gap: 6px; }
  .lateral .logo { padding: 4px 8px 18px; }
  .lateral a { color: #CBD5E1; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 15px; }
  .lateral a:hover { background: var(--marinho-claro); color: #fff; }
  .lateral a.ativo { background: var(--marinho-claro); color: #fff; box-shadow: inset 3px 0 0 var(--ceu); }
  .lateral .usuario { margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 14px 8px 0; font-size: 14px; }
  .lateral .usuario small { display: block; color: var(--ceu); margin-top: 2px; }
  .sair { margin-top: 12px; width: 100%; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 8px; font: inherit; cursor: pointer; }
  .sair:hover { background: var(--marinho-claro); }
  .topo { display: none; }
  .conteudo { padding: 28px 32px; max-width: 1120px; width: 100%; }
  .cabecalho h1 { margin: 0; font-size: 24px; font-weight: 650; }
  .cabecalho p { margin: 6px 0 0; color: var(--mudo); }
  .cabecalho { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .migalha { font-size: 13px; color: var(--mudo); margin-bottom: 6px; } .migalha a { color: var(--azul); text-decoration: none; }

  /* Componentes */
  .cartao { background: #fff; border: 1px solid var(--traco); border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(15,23,42,.06); }
  .cartao h2 { margin: 0 0 14px; font-size: 17px; font-weight: 650; }
  .grade { display: grid; gap: 16px; }
  .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g-form { grid-template-columns: 1.6fr 1fr; align-items: start; }
  .rotulo { display: block; font-size: 14px; font-weight: 550; margin-bottom: 6px; }
  .campo { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--traco); border-radius: 10px; background: #fff; }
  .campo:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-suave); }
  .campo.invalido { border-color: var(--risco); }
  .erro-campo { color: var(--risco); font-size: 13px; margin-top: 4px; }
  .pilha > * + * { margin-top: 14px; }
  .btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 16px; border: 1px solid transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  .btn-primario { background: var(--azul); color: #fff; } .btn-primario:hover { background: var(--azul-escuro); }
  .btn-secundario { background: #fff; border-color: var(--traco); color: var(--texto); }
  .btn-bloco { width: 100%; }
  .msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .msg-erro { background: var(--erro-bg); color: var(--risco); } .msg-ok { background: var(--ok-bg); color: var(--normal); } .msg-info { background: var(--info-bg); color: var(--info); }
  .selo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .s-normal { color: var(--normal); background: var(--normal-bg); } .s-atencao { color: var(--atencao); background: var(--atencao-bg); } .s-risco { color: var(--risco); background: var(--risco-bg); }
  .s-pendente { color: #475569; background: #F1F5F9; }
  .barra { height: 8px; border-radius: 999px; background: var(--traco); overflow: hidden; } .barra span { display: block; height: 100%; background: var(--azul); border-radius: 999px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--traco); } .item input { width: 18px; height: 18px; accent-color: var(--azul); }
  .contagem { display: flex; flex-wrap: wrap; gap: 8px; }
  .empilhada { display: flex; height: 22px; border-radius: 8px; overflow: hidden; background: var(--traco); }
  .empilhada span { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .item-plano { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--traco); font-size: 14px; }
  .item-plano .marca { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--traco); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex: none; }
  .item-plano.feito .marca { background: var(--normal); border-color: var(--normal); } .item-plano.feito span:last-child { color: var(--mudo); text-decoration: line-through; }

  .alerta { border-radius: 14px; padding: 14px 16px; border: 1px solid; display: flex; gap: 12px; align-items: flex-start; }
  .alerta strong { display: block; } .alerta p { margin: 4px 0 0; font-size: 14px; }
  .alerta-atencao { background: var(--atencao-bg); border-color: #FCD34D; color: #78350F; }
  .alerta-risco { background: var(--risco-bg); border-color: #FCA5A5; color: #7F1D1D; }
  .turma-dash.destaque-atencao { border-color: #FCD34D; box-shadow: inset 4px 0 0 var(--atencao); }
  .turma-dash.destaque-risco { border-color: #FCA5A5; box-shadow: inset 4px 0 0 var(--risco); }
  .metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .metricas div { background: var(--nevoa); border-radius: 10px; padding: 8px 10px; } .metricas small { display: block; color: var(--mudo); font-size: 12px; }
  .metricas strong { font-size: 20px; font-variant-numeric: tabular-nums; }
  .etiqueta { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--azul-suave); color: var(--azul-escuro); font-size: 12px; font-weight: 600; }
  .numero small { display: block; color: var(--mudo); font-size: 13px; } .numero strong { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .turma-card h3 { margin: 0; font-size: 16px; } .turma-card p { margin: 6px 0 0; color: var(--mudo); font-size: 14px; }
  .turma-card .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mudo); font-weight: 600; padding: 0 12px 10px; }
  td { padding: 12px; border-top: 1px solid var(--traco); } td.num { font-variant-numeric: tabular-nums; text-align: right; } th.num { text-align: right; }
  tr.selecionada td { background: var(--azul-suave); }
  a.link { color: var(--azul); text-decoration: none; font-weight: 550; }
  .vazio { text-align: center; padding: 28px 12px; color: var(--mudo); } .vazio .icone { font-size: 28px; }
  .atalho { display: block; text-decoration: none; color: inherit; } .atalho:hover .cartao { border-color: var(--azul); }
  .atalho .seta { color: var(--azul); font-weight: 600; font-size: 14px; margin-top: 10px; }
  /* SPEC-016 — dashboards */
  .kpis { display: grid; gap: 14px; margin-bottom: 16px; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
  .kpi { padding: 16px; } .kpi strong { font-size: 28px; display: block; margin-top: 2px; } .kpi .detalhe { display: block; font-size: 12px; color: var(--mudo); margin-top: 2px; }
  .quadrado { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; }
  .cab-cartao { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; } .cab-cartao h2 { margin: 0; }
  .prazo { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--traco); font-size: 14px; }
  .prazo:first-child { border-top: 0; padding-top: 0; }
  .prazo .dia { flex: none; width: 46px; text-align: center; border-radius: 10px; background: var(--azul-suave); color: var(--azul-escuro); padding: 4px 0; line-height: 1.1; }
  .prazo .dia strong { display: block; font-size: 17px; } .prazo .dia small { font-size: 11px; text-transform: uppercase; }
  .prazo .dia.hoje { background: var(--atencao-bg); color: var(--atencao); }
  .prazo div:last-child { min-width: 0; } .prazo p { margin: 2px 0 0; color: var(--mudo); font-size: 13px; }
  .filtro-curso { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filtro-curso select { min-width: 240px; }
  @container (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi strong { font-size: 24px; } .filtro-curso select { min-width: 0; width: 100%; } }

  /* SPEC-017 a SPEC-022 */
  .badge { margin-left: auto; background: #EF4444; color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 8px; }
  .s-encerrado { color: #475569; background: #E2E8F0; } .s-aberto { color: var(--normal); background: var(--normal-bg); }
  .chamada { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--traco); font-size: 15px; }
  .chamada input { width: 20px; height: 20px; accent-color: var(--azul); flex: none; }
  .chamada .falta { margin-left: auto; font-size: 13px; color: var(--risco); font-weight: 600; }
  .registro { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--traco); font-size: 14px; }
  .registro time { color: var(--mudo); font-size: 13px; } .registro p { margin: 3px 0 0; color: var(--mudo); font-size: 13px; }
  .notif { display: flex; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid var(--traco); background: #fff; }
  .notif + .notif { margin-top: 10px; } .notif.nova { border-color: #BFDBFE; background: var(--info-bg); }
  .notif .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .notif strong { display: block; font-size: 15px; } .notif p { margin: 3px 0 0; font-size: 14px; color: var(--mudo); } .notif time { font-size: 12px; color: var(--mudo); }
  .doc-barra { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--traco); }
  .folha { background: #fff; max-width: 820px; margin: 20px auto; padding: 40px 44px; box-shadow: 0 4px 18px rgba(15,23,42,.12); font-size: 13px; }
  .folha .topo-doc { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid var(--marinho); padding-bottom: 14px; }
  .folha h1 { font-size: 20px; margin: 0; letter-spacing: .02em; text-transform: uppercase; } .folha h2 { font-size: 14px; margin: 22px 0 8px; color: var(--marinho); }
  .folha .dados { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px; margin-top: 14px; }
  .folha .dados small { display: block; color: var(--mudo); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .folha table { font-size: 12.5px; } .folha th { font-size: 10.5px; padding: 6px 8px; background: var(--nevoa); } .folha td { padding: 7px 8px; }
  .folha .rodape-doc { margin-top: 26px; padding-top: 10px; border-top: 1px solid var(--traco); color: var(--mudo); font-size: 11px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .res-ok { color: var(--normal); font-weight: 700; } .res-nao { color: var(--risco); font-weight: 700; } .res-curso { color: var(--info); font-weight: 600; }
  @container (max-width: 720px) {
    .registro { grid-template-columns: 1fr; gap: 4px; }
    .folha { margin: 0; padding: 20px 16px; box-shadow: none; } .folha .dados { grid-template-columns: 1fr 1fr; } .folha .larga { overflow-x: auto; }
  }

  /* SPEC-023 a SPEC-025 */
  .meta { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--nevoa); font-size: 14px; }
  .meta strong { font-size: 22px; font-variant-numeric: tabular-nums; min-width: 52px; }
  .meta + .meta { margin-top: 8px; }
  .simula { display: grid; grid-template-columns: 1fr 90px; gap: 8px 12px; align-items: center; font-size: 14px; }
  .comunicado { border: 1px solid var(--traco); border-radius: 14px; padding: 16px; background: #fff; }
  .comunicado + .comunicado { margin-top: 12px; }
  .comunicado h3 { margin: 6px 0 6px; font-size: 16px; } .comunicado p { margin: 0; font-size: 14px; line-height: 1.5; }
  .comunicado .de { font-size: 13px; color: var(--mudo); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Login */
  .login { display: grid; grid-template-columns: 1fr 1fr; min-height: 100%; }
  .login .painel { background: var(--marinho); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
  .login .painel h2 { font-size: 30px; line-height: 1.25; margin: 0 0 12px; font-weight: 650; }
  .login .painel p { color: #CBD5E1; margin: 0; max-width: 380px; }
  .login .lado { display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .login .caixa { width: 100%; max-width: 380px; }
  .login .logo-claro { display: none; margin-bottom: 24px; }
  .login h1 { margin: 0; font-size: 24px; } .login .sub { color: var(--mudo); margin: 6px 0 24px; }
  .simples { display: flex; align-items: center; justify-content: center; min-height: 100%; padding: 24px; text-align: center; }

  /* Celular (moldura estreita) */
  @container (max-width: 720px) {
    .casca { grid-template-columns: 1fr; }
    .lateral { display: none; position: absolute; inset: 56px 0 0 0; z-index: 5; }
    .casca.aberto .lateral { display: flex; }
    .topo { display: flex; align-items: center; justify-content: space-between; background: var(--marinho); height: 56px; padding: 0 12px; position: sticky; top: 0; z-index: 6; }
    .topo button { background: transparent; border: 0; color: #fff; font-size: 24px; cursor: pointer; }
    .conteudo { padding: 18px 16px; }
    .g2, .g3, .g-form { grid-template-columns: 1fr; }
    .login { grid-template-columns: 1fr; } .login .painel { display: none; } .login .logo-claro { display: block; }
    .tabela-resp thead { display: none; }
    .tabela-resp tr { display: block; border-top: 1px solid var(--traco); padding: 10px 0; }
    .tabela-resp td { display: flex; justify-content: space-between; border: 0; padding: 4px 4px; }
    .tabela-resp td::before { content: attr(data-r); color: var(--mudo); font-size: 13px; }
  }
</style>
</head>
<body>
<div class="controles">
  <label for="tela"><strong>Tela:</strong></label>
  <select id="tela"></select>
  <button id="desk" aria-pressed="true">Computador</button>
  <button id="cel" aria-pressed="false">Celular</button>
  <span class="nota">Protótipo de layout — dados fictícios. Fonte: docs/identidade-visual.md</span>
</div>
<div class="palco"><div class="moldura" id="moldura"><div class="tela" id="tela-conteudo"></div></div></div>

<script>
const MARCA = `<svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1E3A5F"/><polyline points="14,45 26,35 36,39 50,20" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="45" r="3.5" fill="#93C5FD"/><circle cx="26" cy="35" r="3.5" fill="#93C5FD"/><circle cx="36" cy="39" r="3.5" fill="#93C5FD"/><circle cx="50" cy="20" r="6" fill="#fff"/></svg>`;
const MARCA_CLARA = MARCA.replace('#1E3A5F', '#0F2A4A');
const logoInverso = (t = 22) => `<span style="display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:${t}px;letter-spacing:-.3px">${MARCA}<span><span style="color:#fff">Study</span><span style="color:#93C5FD">Track</span></span></span>`;
const logoClaro = (t = 22) => `<span style="display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:${t}px;letter-spacing:-.3px">${MARCA_CLARA}<span><span style="color:#0F2A4A">Study</span><span style="color:#2563EB">Track</span></span></span>`;

// SPEC-016: o primeiro item de todo perfil passa a ser o Dashboard; o Administrador ganha Dashboard e Cursos (SPEC-015).
// SPEC-017 a SPEC-022: Chamada substitui Frequência; Notificações (com contador), Documentos, Auditoria e Períodos letivos.
const MENUS = {
  Estudante: [["inicio", "🏠", "Dashboard"], ["atividades", "🗓️", "Minhas atividades"], ["documentos", "📄", "Documentos"], ["comunicados", "📣", "Comunicados"], ["notificacoes", "🔔", "Notificações", 3]],
  Professor: [["inicio", "🏠", "Dashboard"], ["notas", "📝", "Notas e avaliações"], ["frequencia", "✅", "Chamada"], ["atividades", "🗓️", "Atividades"], ["relatorios", "📊", "Relatórios"], ["historico", "🕘", "Histórico de notas"], ["comunicados", "📣", "Comunicados"], ["notificacoes", "🔔", "Notificações", 2]],
  Coordenador: [["inicio", "🏠", "Dashboard"], ["disciplinas", "📚", "Disciplinas"], ["turmas", "👥", "Turmas e estudantes"], ["relatorios", "📊", "Relatórios"], ["historico", "🕘", "Histórico de notas"], ["comunicados", "📣", "Comunicados"], ["auditoria", "🛡️", "Auditoria"], ["area", "🔒", "Área da coordenação"]],
  Administrador: [["inicio", "🏠", "Dashboard"], ["contas", "👤", "Contas"], ["cursos", "🎓", "Cursos"], ["periodos", "📅", "Períodos letivos"], ["auditoria", "🛡️", "Auditoria"]],
};
const USUARIOS = { Estudante: "Ana Souza", Professor: "Prof. Carlos Lima", Coordenador: "Marina Alves", Administrador: "Renata Duarte" };

function casca(perfil, ativo, conteudo) {
  const itens = MENUS[perfil].map(([id, ic, rot, n]) => `<a href="#" class="${id === ativo ? "ativo" : ""}"><span>${ic}</span>${rot}${n ? `<span class="badge" aria-label="${n} não lidas">${n}</span>` : ""}</a>`).join("");
  return `<div class="casca" id="casca">
    <div class="topo">${logoInverso(18)}<button onclick="document.getElementById('casca').classList.toggle('aberto')" aria-label="Abrir menu">☰</button></div>
    <nav class="lateral"><div class="logo">${logoInverso()}</div>${itens}
      <div class="usuario"><strong>${USUARIOS[perfil]}</strong><small>${perfil}</small><a href="#" style="display:block;margin:6px 0 8px;color:#93C5FD;font-size:13px">🔑 Alterar minha senha</a><button class="sair">Sair</button></div></nav>
    <main class="conteudo">${conteudo}</main></div>`;
}
const cab = (titulo, sub = "", acao = "", migalha = "") =>
  `<div>${migalha ? `<div class="migalha">${migalha}</div>` : ""}</div><div class="cabecalho"><div><h1>${titulo}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${acao}</div>`;
const entrega = (s) => ({ NoPrazo: '<span class="selo s-normal">● No prazo</span>', Pendente: '<span class="selo s-pendente">○ Pendente</span>', Atrasada: '<span class="selo s-risco">■ Atrasada</span>' })[s];
const alerta = (nivel, disc, detalhe, prof) => `<div class="alerta alerta-${nivel === 'Risco' ? 'risco' : 'atencao'}"><span style="font-size:18px">${nivel === 'Risco' ? '■' : '▲'}</span><div><strong>${nivel === 'Risco' ? 'Risco' : 'Atenção'} em ${disc}</strong><p>${detalhe}. ${prof ? 'Converse com ' + prof + ', responsável pela turma.' : ''}</p></div></div>`;
function grafico(notas) {
  const L = 300, A = 110, m = 24, passo = notas.length > 1 ? (L - 2 * m) / (notas.length - 1) : 0;
  const y = (v) => A - 20 - (v / 10) * (A - 34);
  const pts = notas.map(([r, v], i) => [m + i * passo, y(v), r, v]);
  const linha = pts.map((p) => p[0] + ',' + p[1]).join(' ');
  const guia = [0, 5, 6, 10].map((v) => `<line x1="${m}" x2="${L - m}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 5 ? '#FCA5A5' : v === 6 ? '#FCD34D' : '#E2E8F0'}" stroke-dasharray="${v === 0 || v === 10 ? '' : '4 4'}"/>`).join('');
  return `<svg viewBox="0 0 ${L} ${A}" width="100%" role="img" aria-label="Evolução das notas">${guia}<polyline points="${linha}" fill="none" stroke="#2563EB" stroke-width="2.5"/>`
    + pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2563EB"/><text x="${p[0]}" y="${p[1] - 9}" font-size="11" text-anchor="middle" fill="#0F172A">${String(p[3]).replace('.', ',')}</text>`    + `<text x="${p[0]}" y="${A - 4}" font-size="10" text-anchor="middle" fill="#64748B">${p[2]}</text>`).join('') + '</svg>';
}
const selo = (s) => ({ Normal: '<span class="selo s-normal">● Normal</span>', Atencao: '<span class="selo s-atencao">▲ Atenção</span>', Risco: '<span class="selo s-risco">■ Risco</span>' })[s];
const campo = (rot, tipo = "text", valor = "", erro = "") =>
  `<div><label class="rotulo">${rot}</label><input class="campo ${erro ? "invalido" : ""}" type="${tipo}" value="${valor}">${erro ? `<div class="erro-campo">${erro}</div>` : ""}</div>`;
const lista = (rot, opcoes, sel = "") => `<div><label class="rotulo">${rot}</label><select class="campo">${["Selecione...", ...opcoes].map((o) => `<option ${o === sel ? "selected" : ""}>${o}</option>`).join("")}</select></div>`;

// SPEC-016 — peças dos dashboards.
const num = (v) => String(v).replace(".", ",");
// Cartão de número: rótulo, valor, cor opcional e detalhe pequeno embaixo.
const kpi = (rot, valor, cor = "", detalhe = "") =>
  `<div class="cartao numero kpi"><small>${rot}</small><strong ${cor ? `style="color:${cor}"` : ""}>${valor}</strong>${detalhe ? `<span class="detalhe">${detalhe}</span>` : ""}</div>`;
const legendaSituacao = `<div class="contagem" style="font-size:13px;margin-top:12px"><span class="selo s-normal">● Normal</span><span class="selo s-atencao">▲ Atenção</span><span class="selo s-risco">■ Risco</span><span class="selo s-pendente">– Sem dados</span></div>`;
// Barra empilhada Normal/Atenção/Risco/Sem dados por item, como no painel da SPEC-014.
function empilhadas(itens, unidade = "estudantes") {
  return `<div class="pilha">${itens.map(([n, a, b, c, d]) => { const tot = a + b + c + d; const w = (x) => (x / tot * 100).toFixed(1) + "%";
    return `<div><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px"><span>${n}</span><span style="color:var(--mudo);white-space:nowrap">${tot} ${unidade}</span></div><div class="empilhada">${a ? `<span style="width:${w(a)};background:var(--normal)">${a}</span>` : ""}${b ? `<span style="width:${w(b)};background:var(--atencao)">${b}</span>` : ""}${c ? `<span style="width:${w(c)};background:var(--risco)">${c}</span>` : ""}${d ? `<span style="width:${w(d)};background:#94A3B8">${d}</span>` : ""}</div></div>`; }).join("")}</div>${legendaSituacao}`;
}
// Média (0–10) e frequência (0–100%) lado a lado na mesma altura, com as linhas de 5,0, 6,0 e 75%.
function mediaFrequencia(itens, rotulo) {
  const L = 330, base = 160, passo = (L - 44) / itens.length, larg = Math.min(22, passo / 2 - 6);
  const barras = itens.map(([n, m, f], i) => { const x = 40 + i * passo + (passo - 2 * larg - 4) / 2; const hm = m * 14; const hf = f / 100 * 140;
    const cm = m < 5 ? "#B91C1C" : m < 6 ? "#B45309" : "#2563EB";
    return `<rect x="${x}" y="${base - hm}" width="${larg}" height="${hm}" rx="3" fill="${cm}"/><rect x="${x + larg + 4}" y="${base - hf}" width="${larg}" height="${hf}" rx="3" fill="${f < 75 ? "#FCA5A5" : "#93C5FD"}"/>`
      + `<text x="${x + larg / 2}" y="${base - hm - 5}" font-size="9" text-anchor="middle">${num(m)}</text><text x="${x + larg * 1.5 + 4}" y="${base - hf - 5}" font-size="9" text-anchor="middle">${f}%</text>`
      + `<text x="${x + larg + 2}" y="${base + 16}" font-size="10" text-anchor="middle" fill="#0F172A">${n}</text>`; }).join("");
  return `<svg viewBox="0 0 ${L} 190" width="100%" role="img" aria-label="${rotulo}">
    <line x1="36" x2="${L - 4}" y1="${base - 105}" y2="${base - 105}" stroke="#93C5FD" stroke-dasharray="4 4"/><text x="32" y="${base - 102}" font-size="9" text-anchor="end" fill="#64748B">75%</text>
    <line x1="36" x2="${L - 4}" y1="${base - 84}" y2="${base - 84}" stroke="#FCD34D" stroke-dasharray="4 4"/><text x="32" y="${base - 81}" font-size="9" text-anchor="end" fill="#64748B">6,0</text>
    <line x1="36" x2="${L - 4}" y1="${base - 70}" y2="${base - 70}" stroke="#FCA5A5" stroke-dasharray="4 4"/><text x="32" y="${base - 67}" font-size="9" text-anchor="end" fill="#64748B">5,0</text>
    ${barras}<line x1="36" x2="${L - 4}" y1="${base}" y2="${base}" stroke="#E2E8F0"/></svg>
    <div class="contagem" style="font-size:13px"><span><span class="quadrado" style="background:#2563EB"></span> Média (0–10)</span><span><span class="quadrado" style="background:#93C5FD"></span> Frequência (0–100%)</span><span style="color:var(--mudo)">Barra vermelha/âmbar: abaixo do limite</span></div>`;
}
// Barras horizontais simples (contagens).
const barrasH = (itens, cor = "var(--azul)") => {
  const max = Math.max(...itens.map((i) => i[1]));
  return `<div class="pilha">${itens.map(([n, v, c]) => `<div><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px"><span>${n}</span><strong style="font-variant-numeric:tabular-nums">${v}</strong></div><div class="barra" style="height:12px"><span style="width:${(v / max * 100).toFixed(1)}%;background:${c || cor}"></span></div></div>`).join("")}</div>`;
};
const progresso = (p) => `<div style="display:flex;align-items:center;gap:10px"><div class="barra" style="flex:1"><span style="width:${p}%"></span></div><span style="font-size:13px;font-variant-numeric:tabular-nums;min-width:36px;text-align:right">${p}%</span></div>`;

// SPEC-015: com comCurso, o formulário mostra o perfil Estudante com o campo Curso e o aviso de coordenador de curso.
function contas(comErro, comCurso = false) {

  const linhas = [
    ["Renata Duarte", "admin@studytrack.test", "Administrador", true, "(você)"],
    ["Marina Alves", "marina.alves@studytrack.test", "Coordenador", true, "Desativar"],
    ["Carlos Lima", "carlos.lima@studytrack.test", "Professor", true, "Desativar"],
    ["Ana Souza", "ana.souza@studytrack.test", "Estudante", true, "Desativar"],
    ["Rui Prado", "rui.prado@studytrack.test", "Estudante", false, "Reativar"],
  ].map(([n, e, p, a, acao]) => `<tr><td data-r="Conta"><strong style="font-weight:600">${n}</strong><br><small style="color:var(--mudo)">${e}</small></td><td data-r="Perfil"><span class="etiqueta">${p}</span></td><td data-r="Situação">${situacao(a)}</td><td data-r="Ação">${acao === "(você)" ? '<span style="color:var(--mudo)">(você)</span>' : `<a class="link" href="#">${acao}</a>`}</td></tr>`).join("");
  return `${cab("Contas", "Crie contas, escolha o perfil de cada uma e controle quem pode entrar. Dados acadêmicos não aparecem aqui.")}
    ${comErro ? '<div class="msg msg-erro" style="margin-bottom:16px" role="alert">Carlos Lima é professor responsável por 2 turmas e não pode ser desativado.</div>' : ""}
    ${comCurso ? '<div class="msg msg-erro" style="margin-bottom:16px" role="alert">Marina Alves coordena Engenharia da Computação e Ciência da Computação e não pode ser desativada. Escolha outra coordenação em Cursos antes.</div>' : ""}
    <div class="grade g-form">
      <div class="cartao"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px"><h2 style="margin:0">Contas (5)</h2><div style="min-width:180px">${lista("Perfil", ["Todos", "Estudante", "Professor", "Coordenador", "Administrador"], "Todos")}</div></div>
        <table class="tabela-resp"><thead><tr><th>Conta</th><th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>
      <div class="cartao"><h2>Nova conta</h2><div class="pilha">
        ${campo("Nome", "text", comErro ? "" : "", comErro ? "Informe o nome." : "")}
        ${campo("E-mail", "email", comErro ? "ana.souza@studytrack.test" : "", comErro ? "Já existe uma conta com este e-mail." : "")}
        ${campo("Senha inicial (mínimo 8 caracteres)", "password")}
        ${lista("Perfil", ["Estudante", "Professor", "Coordenador", "Administrador"], comCurso ? "Estudante" : "Professor")}
        ${comCurso ? `${lista("Curso", ["Engenharia da Computação", "Ciência da Computação", "Engenharia Elétrica", "Sistemas de Informação", "Publicidade e Propaganda", "Administração"], "")}<div class="erro-campo" style="margin-top:-8px">Escolha o curso do estudante.</div>` : ""}
        <p style="margin:0;font-size:13px;color:var(--mudo)">A pessoa entra com este e-mail e esta senha. Estudantes também podem ser cadastrados pela coordenação, já matriculados na turma.</p>
        <button class="btn btn-primario btn-bloco">Criar conta</button></div></div>
    </div>`;
}

const seletor = document.getElementById("tela"), alvo = document.getElementById("tela-conteudo"), moldura = document.getElementById("moldura");
for (const [id, [rotulo]] of Object.entries(TELAS)) seletor.add(new Option(rotulo, id));
function mostrar(id) { if (!TELAS[id]) id = "identidade"; seletor.value = id; alvo.innerHTML = TELAS[id][1](); alvo.scrollTop = 0; history.replaceState(null, "", "#" + id); }
seletor.onchange = () => mostrar(seletor.value);
function viewport(celular) { moldura.classList.toggle("celular", celular); document.getElementById("cel").setAttribute("aria-pressed", celular); document.getElementById("desk").setAttribute("aria-pressed", !celular); }
document.getElementById("cel").onclick = () => viewport(true);
document.getElementById("desk").onclick = () => viewport(false);
mostrar(location.hash.slice(1));
</script>
